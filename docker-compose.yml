version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: defi-postgres
    environment:
      POSTGRES_DB: defi_analytics
      POSTGRES_USER: defi_user
      POSTGRES_PASSWORD: defi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defi_user -d defi_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - defi-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: defi-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - defi-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defi-backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://defi_user:defi_password@postgres:5432/defi_analytics
      - REDIS_URL=redis://redis:6379/0
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - defi-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: defi-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ENVIRONMENT=production
    ports:
      - "3001:3001"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - defi-network

  # Streamlit Dashboard (optional)
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defi-streamlit
    command: streamlit run dashboard/defi_dashboard.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - DATABASE_URL=postgresql://defi_user:defi_password@postgres:5432/defi_analytics
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8501:8501"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - defi-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  defi-network:
    driver: bridge
