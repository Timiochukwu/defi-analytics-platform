name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract version from tag
      id: extract_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/defi-analytics-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/defi-analytics-backend:${{ steps.extract_version.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/defi-analytics-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/defi-analytics-frontend:${{ steps.extract_version.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          cd /opt/defi-analytics
          docker-compose pull
          docker-compose up -d
          docker system prune -af

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          README.md
          LICENSE
        body: |
          ## DeFi Analytics Platform ${{ steps.extract_version.outputs.VERSION }}

          ### What's Changed
          See CHANGELOG.md for details

          ### Docker Images
          - Backend: `defi-analytics-backend:${{ steps.extract_version.outputs.VERSION }}`
          - Frontend: `defi-analytics-frontend:${{ steps.extract_version.outputs.VERSION }}`
